# Contenedor web (PLAN 2): el único punto de entrada. Sirve el frontend y hace de reverse proxy:
#   /api/identity/   → identity:3001
#   /api/viajes/     → dispatch:3005
#   /api/ubicacion/  → location:3004
# Se incluye dentro del bloque http de nginx (conf.d).

server_tokens off;

# DNS de Docker: los servicios se resuelven en cada pedido (con caché de 10 s). Así nginx arranca
# aunque alguno todavía no esté, y sigue a un contenedor que se recreó con otra IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# La respuesta de nginx cuando una ruta no se publica: con el mismo formato que los servicios.
map $request_id $no_encontrado {
    default '{"error":{"code":"RUTA_NO_ENCONTRADA","message":"La ruta no existe","requestId":"$request_id"}}';
}

# El cuerpo que nginx corta antes de llegar al servicio: el mismo 413 que da platform.
map $request_id $demasiado_grande {
    default '{"error":{"code":"CUERPO_DEMASIADO_GRANDE","message":"El cuerpo supera el límite permitido","requestId":"$request_id"}}';
}

server {
    listen 8080;
    server_name _;

    # Los servicios aceptan cuerpos de hasta 16 kB. Entre 16 y 32 kB responde el servicio; por encima,
    # nginx, con el mismo formato de error (y no su página HTML).
    client_max_body_size 32k;
    error_page 413 @demasiado_grande;

    # En el entorno publicado, Caddy (TLS) va delante con la IP fija CADDY_IP (deploy/compose.produccion.yml):
    # el cliente real es el que Caddy pone en X-Forwarded-For. Solo se cree si viene de esa IP; en
    # Coolify (docker-compose.coolify.yml) va delante Traefik, sin IP fija: ahí CADDY_IP es la red (CIDR). En
    # desarrollo no hay Caddy y $remote_addr queda como está. ${CADDY_IP} lo reemplaza la imagen al arrancar
    # (Dockerfile, plantilla de nginx); el Compose lo pasa desde el .env.
    set_real_ip_from ${CADDY_IP};
    real_ip_header X-Forwarded-For;
    location @demasiado_grande {
        default_type application/json;
        return 413 $demasiado_grande;
    }

    # --- Hacia los servicios ---------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # El Host del upstream (identity:3001, ...), no el que manda el cliente: ningún servicio arma URLs
    # con él, y así un Host inventado no llega a los servicios (Semgrep, request-host-used).
    proxy_set_header Host $proxy_host;
    # REEMPLAZA X-Forwarded-For (no le agrega): lo que mande el cliente no llega a los servicios. Los
    # servicios confían en este encabezado solo si viene de la IP de este contenedor (CONFIAR_EN_PROXY).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El mismo id en el log de nginx y en el de cada servicio (middlewareRequestId de platform).
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Lo interno no se publica: /interno/* (de servicio a servicio, con token de servicio), /metrics
    # (lo lee Alloy) y /ready (cuenta el estado de Postgres y Redis). Sin distinguir mayúsculas (~*),
    # porque Express tampoco las distingue. nginx compara contra la ruta ya decodificada y normalizada:
    # %69nterno, //interno o /./interno caen acá igual.
    location ~* ^/api/(identity|viajes|ubicacion)/(interno|metrics|ready)(/|$) {
        default_type application/json;
        return 404 $no_encontrado;
    }

    location /api/identity/ {
        set $identity http://identity:3001;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass $identity;
    }

    location /api/ubicacion/ {
        set $location http://location:3004;
        rewrite ^/api/ubicacion/(.*)$ /$1 break;
        proxy_pass $location;
    }

    # SSE (docs/eventos.md): cada evento sale apenas llega, sin juntarse en el buffer de nginx, y la
    # conexión queda abierta. El latido de dispatch (15 s) es menor que proxy_read_timeout, así que
    # nginx no la corta por inactividad. dispatch manda además X-Accel-Buffering: no.
    location = /api/viajes/eventos {
        set $dispatch http://dispatch:3005;
        rewrite ^ /eventos break;
        proxy_pass $dispatch;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
    }

    location /api/viajes/ {
        set $dispatch http://dispatch:3005;
        rewrite ^/api/viajes/(.*)$ /$1 break;
        proxy_pass $dispatch;
    }

    # Cualquier otro /api/: no existe (y no cae en el index.html del frontend).
    location /api/ {
        default_type application/json;
        return 404 $no_encontrado;
    }

    # --- El frontend -----------------------------------------------------------------------------
    # Los archivos del build de Vite llevan un hash en el nombre: cambian de nombre si cambian, así que
    # se cachean para siempre. Un archivo que no existe es 404 (no el index.html). add_header en este
    # location reemplaza a los de afuera: por eso repite nosniff.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        root /usr/share/nginx/html;
        # Una aplicación de una sola página: las rutas del frontend devuelven el index.html.
        try_files $uri $uri/ /index.html;

        # CSP de la página (PLAN, Fase B). Todo del mismo origen; el build de Vite no necesita scripts
        # ni estilos en línea. Lo único de afuera son las teselas del mapa (OpenStreetMap, con Leaflet
        # dentro del bundle): solo como imágenes.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # El chofer comparte su ubicación desde el navegador: geolocalización solo para esta página.
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
        # HSTS: el navegador no vuelve a entrar por HTTP. Con Caddy lo pone Caddy (y reemplaza este); en
        # Coolify, Traefik no lo agrega. Por HTTP (desarrollo) el navegador lo ignora. La API lo trae de helmet.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Para el healthcheck del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
