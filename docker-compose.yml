name: app-viajes

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "${POSTGRES_PUERTO_HOST:-5434}:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y no por el socket: con el volumen vacío, los scripts de init corren sobre un servidor
      # temporal que escucha solo en el socket. Sin -h, daría healthy con el init a medias.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    build:
      context: .
      args:
        SERVICE: identity
    image: ghcr.io/grupo7/viajes-identity:${VERSION:-0.1.0}
    environment:
      PUERTO: "3001"
      # Detrás de nginx: cree en el X-Forwarded-For solo si viene del contenedor web (su IP fija).
      CONFIAR_EN_PROXY: ${WEB_IP:-10.250.77.10}
      IDENTITY_PERSISTENCIA: postgres
      IDENTITY_DATABASE_URL: postgresql://identity_svc:${DB_PASSWORD_IDENTITY:-identity_dev}@postgres:5432/identity
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Con :- y no :? para que `npm run infra:up` funcione sin la clave. Si falta, identity no arranca y lo dice.
      IDENTITY_JWT_CLAVE_PRIVADA_B64: ${IDENTITY_JWT_CLAVE_PRIVADA_B64:-}
      # Secreto de /interno/usuarios/:id (lo usa dispatch). Con :-: si falta, identity no arranca y lo dice.
      IDENTITY_TOKEN_SERVICIO: ${IDENTITY_TOKEN_SERVICIO:-}
      # Límite de intentos de login. Vacías: los valores por defecto de identity. El e2e sube el de la IP
      # (cuenta también los login correctos, y los flujos entran muchas veces desde la misma).
      IDENTITY_LOGIN_MAX_POR_EMAIL: ${IDENTITY_LOGIN_MAX_POR_EMAIL:-}
      IDENTITY_LOGIN_MAX_POR_IP: ${IDENTITY_LOGIN_MAX_POR_IP:-}
    ports:
      - "3001:3001"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  location:
    build:
      context: .
      args:
        SERVICE: location
    image: ghcr.io/grupo7/viajes-location:${VERSION:-0.1.0}
    environment:
      PUERTO: "3004"
      # Detrás de nginx: cree en el X-Forwarded-For solo si viene del contenedor web (su IP fija).
      CONFIAR_EN_PROXY: ${WEB_IP:-10.250.77.10}
      # Del .env (ingenua u optimizada, docs/location.md). Vacía: ingenua.
      UBICACION_ESTRATEGIA: ${UBICACION_ESTRATEGIA:-ingenua}
      LOCATION_DATABASE_URL: postgresql://location_svc:${DB_PASSWORD_LOCATION:-location_dev}@postgres:5432/location
      # Posiciones e historial en la optimizada; en las dos, la publicación de la posición en vivo.
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Con :- para que `npm run infra:up` funcione sin él. Si falta, location no arranca y lo dice.
      LOCATION_TOKEN_SERVICIO: ${LOCATION_TOKEN_SERVICIO:-}
      # Retención del historial (docs/location.md#retención-del-historial). Vacías si no están en el .env:
      # location usa sus valores por defecto (720 h, 5 min y lotes de 5000), definidos en src/config.
      LOCATION_HISTORIAL_RETENCION_HORAS: ${LOCATION_HISTORIAL_RETENCION_HORAS:-}
      LOCATION_HISTORIAL_RETENCION_INTERVALO_MS: ${LOCATION_HISTORIAL_RETENCION_INTERVALO_MS:-}
      LOCATION_HISTORIAL_RETENCION_LOTE: ${LOCATION_HISTORIAL_RETENCION_LOTE:-}
      # Retención por viaje: vacía, el menor entre 24 h y la retención total. Para saber qué ping fue de un
      # viaje pregunta a dispatch (red interna; /interno/* no se publica). Sin token, no clasifica.
      LOCATION_HISTORIAL_SIN_VIAJE_HORAS: ${LOCATION_HISTORIAL_SIN_VIAJE_HORAS:-}
      DISPATCH_URL: http://dispatch:3005
      DISPATCH_TOKEN_SERVICIO: ${DISPATCH_TOKEN_SERVICIO:-}
      DISPATCH_TIMEOUT_MS: ${DISPATCH_TIMEOUT_MS:-}
      # Límite de tasa de los pings, por usuario. Vacía: el valor por defecto de location (120 por minuto).
      LIMITE_UBICACIONES_POR_MINUTO: ${LIMITE_UBICACIONES_POR_MINUTO:-}
    ports:
      - "3004:3004"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatch:
    build:
      context: .
      args:
        SERVICE: dispatch
    image: ghcr.io/grupo7/viajes-dispatch:${VERSION:-0.1.0}
    environment:
      PUERTO: "3005"
      # Detrás de nginx: cree en el X-Forwarded-For solo si viene del contenedor web (su IP fija).
      CONFIAR_EN_PROXY: ${WEB_IP:-10.250.77.10}
      DISPATCH_PERSISTENCIA: postgres
      DATABASE_URL: postgresql://dispatch_svc:${DB_PASSWORD_DISPATCH:-dispatch_dev}@postgres:5432/dispatch
      # Cerrojo de la Idempotency-Key (claves con prefijo dispatch:idempotencia:).
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Candidatos desde location (red interna del Compose; /interno/* no se publica por nginx).
      DISPATCH_BUSCADOR: ${DISPATCH_BUSCADOR:-location}
      LOCATION_URL: http://location:3004
      LOCATION_TOKEN_SERVICIO: ${LOCATION_TOKEN_SERVICIO:-}
      LOCATION_TIMEOUT_MS: ${LOCATION_TIMEOUT_MS:-1000}
      DISPATCH_RADIO_BUSQUEDA_METROS: ${DISPATCH_RADIO_BUSQUEDA_METROS:-5000}
      DISPATCH_CANDIDATOS_DEMO: ${DISPATCH_CANDIDATOS_DEMO:-}
      # Ofertas: cuántas a la vez y cuánto duran. Vacías: los valores por defecto de dispatch (3 y 15 s).
      # El e2e usa 1 y 6 s, para probar que una oferta vencida pasa al siguiente chofer.
      OFERTAS_SIMULTANEAS: ${OFERTAS_SIMULTANEAS:-}
      OFERTA_TTL_SEGUNDOS: ${OFERTA_TTL_SEGUNDOS:-}
      # Límite de tasa de la solicitud, por pasajero. Vacía: el valor por defecto de dispatch (10 por minuto).
      LIMITE_SOLICITUDES_POR_MINUTO: ${LIMITE_SOLICITUDES_POR_MINUTO:-}
      LIMITE_RUTAS_POR_MINUTO: ${LIMITE_RUTAS_POR_MINUTO:-}
      # Retención de los eventos publicados del outbox. Vacía: 24 h.
      OUTBOX_RETENCION_HORAS: ${OUTBOX_RETENCION_HORAS:-}
      # Flotas: el alta de un chofer verifica la cuenta en identity (red interna; /interno/* no se publica).
      IDENTITY_URL: http://identity:3001
      IDENTITY_TOKEN_SERVICIO: ${IDENTITY_TOKEN_SERVICIO:-}
      IDENTITY_TIMEOUT_MS: ${IDENTITY_TIMEOUT_MS:-1000}
      # Retención por viaje: location consulta POST /interno/tramos-viaje con este token. Vacío: la ruta no
      # se monta y location conserva los pings sin viaje hasta la retención total.
      DISPATCH_TOKEN_SERVICIO: ${DISPATCH_TOKEN_SERVICIO:-}
      # Tarifa y mapas (docs/tarifas.md). Con :- y sin valor: si no están en el .env, llegan vacías y
      # dispatch usa sus valores por defecto, que se definen en un solo lugar (src/config).
      TARIFA_BAJADA_CENTAVOS: ${TARIFA_BAJADA_CENTAVOS:-}
      TARIFA_CENTAVOS_POR_KM: ${TARIFA_CENTAVOS_POR_KM:-}
      TARIFA_CENTAVOS_POR_MINUTO: ${TARIFA_CENTAVOS_POR_MINUTO:-}
      TARIFA_MINIMO_CENTAVOS: ${TARIFA_MINIMO_CENTAVOS:-}
      TARIFA_MAX_METROS: ${TARIFA_MAX_METROS:-}
      MAPAS_FACTOR_DESVIO: ${MAPAS_FACTOR_DESVIO:-}
      MAPAS_VELOCIDAD_KMH: ${MAPAS_VELOCIDAD_KMH:-}
      MAPAS_TIMEOUT_MS: ${MAPAS_TIMEOUT_MS:-}
      MAPAS_PROVEEDOR: ${MAPAS_PROVEEDOR:-}
      MAPAS_OSRM_URL: ${MAPAS_OSRM_URL:-}
      MAPAS_OSRM_TIMEOUT_MS: ${MAPAS_OSRM_TIMEOUT_MS:-}
      MAPAS_LATENCIA_SIMULADA_MS: ${MAPAS_LATENCIA_SIMULADA_MS:-}
      TARIFAS_CACHE_TTL_SEGUNDOS: ${TARIFAS_CACHE_TTL_SEGUNDOS:-}
      ZONAS_CACHE_TTL_SEGUNDOS: ${ZONAS_CACHE_TTL_SEGUNDOS:-}
      PAGOS_TIMEOUT_MS: ${PAGOS_TIMEOUT_MS:-}
      PAGOS_LATENCIA_SIMULADA_MS: ${PAGOS_LATENCIA_SIMULADA_MS:-}
      PAGOS_RECHAZAR_DESDE_CENTAVOS: ${PAGOS_RECHAZAR_DESDE_CENTAVOS:-}
    ports:
      - "3005:3005"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Punto de entrada único (infra/web): sirve el frontend y hace de reverse proxy a los tres servicios.
  # Los puertos de los servicios se publican solo para desarrollo; en el entorno publicado, solo este.
  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    image: ghcr.io/grupo7/viajes-web:${VERSION:-0.1.0}
    environment:
      # La IP de Caddy en el entorno publicado (deploy/), la única cuyo X-Forwarded-For cree nginx.
      CADDY_IP: ${CADDY_IP:-10.250.77.11}
    ports:
      - "${WEB_PUERTO:-8080}:8080"
    networks:
      proxy:
        # Fija: es la única IP en la que los servicios confían para X-Forwarded-For (CONFIAR_EN_PROXY).
        ipv4_address: ${WEB_IP:-10.250.77.10}
    depends_on:
      - identity
      - location
      - dispatch

  # Observabilidad, OPCIONAL: solo con `docker compose --profile obs up -d`. Sin el perfil no se crea, y
  # nada depende de él. Lee /metrics de los tres servicios por la red interna y los logs JSON por el
  # socket de Docker, y los manda a Grafana Cloud (docs/observabilidad.md). Las credenciales, solo en el
  # .env: si faltan, Alloy arranca igual pero no envía nada (lo avisa en su log), y nada más se entera.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["obs"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # La interfaz de depuración de Alloy (estado de cada componente), publicada solo en el host.
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USUARIO: ${GRAFANA_CLOUD_PROM_USUARIO:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USUARIO: ${GRAFANA_CLOUD_LOKI_USUARIO:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      # Bearer de /metrics: el mismo METRICAS_TOKEN de los servicios. OBS_METRICAS_TOKEN lo reemplaza para
      # leer el entorno de carga sin tocar el de los servicios.
      OBS_METRICAS_TOKEN: ${OBS_METRICAS_TOKEN:-${METRICAS_TOKEN:-}}
      # Qué se lee y con qué etiqueta. Por defecto, este Compose; para una corrida de k6, el de carga.
      OBS_ENTORNO: ${OBS_ENTORNO:-desarrollo}
      OBS_IDENTITY: ${OBS_IDENTITY:-identity:3001}
      OBS_LOCATION: ${OBS_LOCATION:-location:3004}
      OBS_DISPATCH: ${OBS_DISPATCH:-dispatch:3005}
      OBS_INTERVALO: ${OBS_INTERVALO:-15s}
    volumes:
      - ./observabilidad/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Solo para descubrir los contenedores y leer sus logs. Es un acceso amplio al daemon: por eso
      # Alloy va en un perfil aparte y no publica nada fuera del host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # WAL de las métricas: si Grafana Cloud no responde un rato, se reenvían al volver.
      - alloy_datos:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - default

volumes:
  pg_datos:
  alloy_datos:

networks:
  # nginx y los tres servicios. Subred propia para que la IP de web sea fija; fuera de los 172.x que
  # Docker reparte por defecto. Si choca con otra red de la máquina, se cambian WEB_RED y WEB_IP en el .env.
  proxy:
    ipam:
      config:
        - subnet: ${WEB_RED:-10.250.77.0/28}
