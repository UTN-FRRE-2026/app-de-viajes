name: app-viajes

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "${POSTGRES_PUERTO_HOST:-5434}:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  dispatch:
    build:
      context: .
      args:
        SERVICE: dispatch
    image: ghcr.io/grupo7/viajes-dispatch:${VERSION:-0.1.0}
    environment:
      PUERTO: "3005"
      DISPATCH_PERSISTENCIA: postgres
      DATABASE_URL: postgresql://dispatch_svc:${DB_PASSWORD_DISPATCH:-dispatch_dev}@postgres:5432/dispatch
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      DISPATCH_CANDIDATOS_DEMO: ${DISPATCH_CANDIDATOS_DEMO:-}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_datos:
