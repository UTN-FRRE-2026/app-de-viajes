name: app-viajes

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "${POSTGRES_PUERTO_HOST:-5434}:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y no por el socket: con el volumen vacío, los scripts de init corren sobre un servidor
      # temporal que escucha solo en el socket. Sin -h, daría healthy con el init a medias.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    build:
      context: .
      args:
        SERVICE: identity
    image: ghcr.io/grupo7/viajes-identity:${VERSION:-0.1.0}
    environment:
      PUERTO: "3001"
      # Detrás de nginx: cree en el X-Forwarded-For solo si viene del contenedor web (su IP fija).
      CONFIAR_EN_PROXY: ${WEB_IP:-10.250.77.10}
      IDENTITY_PERSISTENCIA: postgres
      IDENTITY_DATABASE_URL: postgresql://identity_svc:${DB_PASSWORD_IDENTITY:-identity_dev}@postgres:5432/identity
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Con :- y no :? para que `npm run infra:up` funcione sin la clave. Si falta, identity no arranca y lo dice.
      IDENTITY_JWT_CLAVE_PRIVADA_B64: ${IDENTITY_JWT_CLAVE_PRIVADA_B64:-}
      # Secreto de /interno/usuarios/:id (lo usa dispatch). Con :-: si falta, identity no arranca y lo dice.
      IDENTITY_TOKEN_SERVICIO: ${IDENTITY_TOKEN_SERVICIO:-}
    ports:
      - "3001:3001"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  location:
    build:
      context: .
      args:
        SERVICE: location
    image: ghcr.io/grupo7/viajes-location:${VERSION:-0.1.0}
    environment:
      PUERTO: "3004"
      # Detrás de nginx: cree en el X-Forwarded-For solo si viene del contenedor web (su IP fija).
      CONFIAR_EN_PROXY: ${WEB_IP:-10.250.77.10}
      UBICACION_ESTRATEGIA: ingenua
      LOCATION_DATABASE_URL: postgresql://location_svc:${DB_PASSWORD_LOCATION:-location_dev}@postgres:5432/location
      # Posiciones e historial en la optimizada; en las dos, la publicación de la posición en vivo.
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Con :- para que `npm run infra:up` funcione sin él. Si falta, location no arranca y lo dice.
      LOCATION_TOKEN_SERVICIO: ${LOCATION_TOKEN_SERVICIO:-}
    ports:
      - "3004:3004"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatch:
    build:
      context: .
      args:
        SERVICE: dispatch
    image: ghcr.io/grupo7/viajes-dispatch:${VERSION:-0.1.0}
    environment:
      PUERTO: "3005"
      # Detrás de nginx: cree en el X-Forwarded-For solo si viene del contenedor web (su IP fija).
      CONFIAR_EN_PROXY: ${WEB_IP:-10.250.77.10}
      DISPATCH_PERSISTENCIA: postgres
      DATABASE_URL: postgresql://dispatch_svc:${DB_PASSWORD_DISPATCH:-dispatch_dev}@postgres:5432/dispatch
      # Cerrojo de la Idempotency-Key (claves con prefijo dispatch:idempotencia:).
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Candidatos desde location (red interna del Compose; /interno/* no se publica por nginx).
      DISPATCH_BUSCADOR: ${DISPATCH_BUSCADOR:-location}
      LOCATION_URL: http://location:3004
      LOCATION_TOKEN_SERVICIO: ${LOCATION_TOKEN_SERVICIO:-}
      LOCATION_TIMEOUT_MS: ${LOCATION_TIMEOUT_MS:-1000}
      DISPATCH_RADIO_BUSQUEDA_METROS: ${DISPATCH_RADIO_BUSQUEDA_METROS:-5000}
      DISPATCH_CANDIDATOS_DEMO: ${DISPATCH_CANDIDATOS_DEMO:-}
      # Flotas: el alta de un chofer verifica la cuenta en identity (red interna; /interno/* no se publica).
      IDENTITY_URL: http://identity:3001
      IDENTITY_TOKEN_SERVICIO: ${IDENTITY_TOKEN_SERVICIO:-}
      IDENTITY_TIMEOUT_MS: ${IDENTITY_TIMEOUT_MS:-1000}
      # Tarifa y mapas (docs/tarifas.md). Con :- y sin valor: si no están en el .env, llegan vacías y
      # dispatch usa sus valores por defecto, que se definen en un solo lugar (src/config).
      TARIFA_BAJADA_CENTAVOS: ${TARIFA_BAJADA_CENTAVOS:-}
      TARIFA_CENTAVOS_POR_KM: ${TARIFA_CENTAVOS_POR_KM:-}
      TARIFA_CENTAVOS_POR_MINUTO: ${TARIFA_CENTAVOS_POR_MINUTO:-}
      TARIFA_MINIMO_CENTAVOS: ${TARIFA_MINIMO_CENTAVOS:-}
      TARIFA_MAX_METROS: ${TARIFA_MAX_METROS:-}
      MAPAS_FACTOR_DESVIO: ${MAPAS_FACTOR_DESVIO:-}
      MAPAS_VELOCIDAD_KMH: ${MAPAS_VELOCIDAD_KMH:-}
      MAPAS_TIMEOUT_MS: ${MAPAS_TIMEOUT_MS:-}
      MAPAS_LATENCIA_SIMULADA_MS: ${MAPAS_LATENCIA_SIMULADA_MS:-}
      TARIFAS_CACHE_TTL_SEGUNDOS: ${TARIFAS_CACHE_TTL_SEGUNDOS:-}
      PAGOS_TIMEOUT_MS: ${PAGOS_TIMEOUT_MS:-}
      PAGOS_LATENCIA_SIMULADA_MS: ${PAGOS_LATENCIA_SIMULADA_MS:-}
      PAGOS_RECHAZAR_DESDE_CENTAVOS: ${PAGOS_RECHAZAR_DESDE_CENTAVOS:-}
    ports:
      - "3005:3005"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Punto de entrada único (infra/web): sirve el frontend y hace de reverse proxy a los tres servicios.
  # Los puertos de los servicios se publican solo para desarrollo; en el entorno publicado, solo este.
  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    image: ghcr.io/grupo7/viajes-web:${VERSION:-0.1.0}
    ports:
      - "${WEB_PUERTO:-8080}:8080"
    networks:
      proxy:
        # Fija: es la única IP en la que los servicios confían para X-Forwarded-For (CONFIAR_EN_PROXY).
        ipv4_address: ${WEB_IP:-10.250.77.10}
    depends_on:
      - identity
      - location
      - dispatch

volumes:
  pg_datos:

networks:
  # nginx y los tres servicios. Subred propia para que la IP de web sea fija; fuera de los 172.x que
  # Docker reparte por defecto. Si choca con otra red de la máquina, se cambian WEB_RED y WEB_IP en el .env.
  proxy:
    ipam:
      config:
        - subnet: ${WEB_RED:-10.250.77.0/28}
