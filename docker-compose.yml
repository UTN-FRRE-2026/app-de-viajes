name: app-viajes

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "${POSTGRES_PUERTO_HOST:-5434}:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y no por el socket: con el volumen vacío, los scripts de init corren sobre un servidor
      # temporal que escucha solo en el socket. Sin -h, daría healthy con el init a medias.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    build:
      context: .
      args:
        SERVICE: identity
    image: ghcr.io/grupo7/viajes-identity:${VERSION:-0.1.0}
    environment:
      PUERTO: "3001"
      IDENTITY_PERSISTENCIA: postgres
      IDENTITY_DATABASE_URL: postgresql://identity_svc:${DB_PASSWORD_IDENTITY:-identity_dev}@postgres:5432/identity
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Con :- y no :? para que `npm run infra:up` funcione sin la clave. Si falta, identity no arranca y lo dice.
      IDENTITY_JWT_CLAVE_PRIVADA_B64: ${IDENTITY_JWT_CLAVE_PRIVADA_B64:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  location:
    build:
      context: .
      args:
        SERVICE: location
    image: ghcr.io/grupo7/viajes-location:${VERSION:-0.1.0}
    environment:
      PUERTO: "3004"
      UBICACION_ESTRATEGIA: ingenua
      LOCATION_DATABASE_URL: postgresql://location_svc:${DB_PASSWORD_LOCATION:-location_dev}@postgres:5432/location
      # Solo lo usa la estrategia optimizada.
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Con :- para que `npm run infra:up` funcione sin él. Si falta, location no arranca y lo dice.
      LOCATION_TOKEN_SERVICIO: ${LOCATION_TOKEN_SERVICIO:-}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatch:
    build:
      context: .
      args:
        SERVICE: dispatch
    image: ghcr.io/grupo7/viajes-dispatch:${VERSION:-0.1.0}
    environment:
      PUERTO: "3005"
      DISPATCH_PERSISTENCIA: postgres
      DATABASE_URL: postgresql://dispatch_svc:${DB_PASSWORD_DISPATCH:-dispatch_dev}@postgres:5432/dispatch
      # Cerrojo de la Idempotency-Key (claves con prefijo dispatch:idempotencia:).
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://identity:3001/.well-known/jwks.json
      JWT_ISSUER: viajes-identity
      JWT_AUDIENCE: viajes
      # Bearer de /metrics. Con :- como LOCATION_TOKEN_SERVICIO: si falta, el servicio no arranca y lo dice.
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Candidatos desde location (red interna del Compose; /interno/* no se publica por nginx).
      DISPATCH_BUSCADOR: ${DISPATCH_BUSCADOR:-location}
      LOCATION_URL: http://location:3004
      LOCATION_TOKEN_SERVICIO: ${LOCATION_TOKEN_SERVICIO:-}
      LOCATION_TIMEOUT_MS: ${LOCATION_TIMEOUT_MS:-1000}
      DISPATCH_RADIO_BUSQUEDA_METROS: ${DISPATCH_RADIO_BUSQUEDA_METROS:-5000}
      DISPATCH_CANDIDATOS_DEMO: ${DISPATCH_CANDIDATOS_DEMO:-}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_datos:
