name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura del repo: ningún job publica nada fuera de sus artefactos.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dispatch_svc
          POSTGRES_PASSWORD: dispatch_dev
          POSTGRES_DB: dispatch_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dispatch_svc -d dispatch_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://dispatch_svc:dispatch_dev@localhost:5434/dispatch_test
      IDENTITY_DATABASE_URL_TEST: postgresql://identity_svc:identity_dev@localhost:5434/identity_test
      LOCATION_DATABASE_URL_TEST: postgresql://location_svc:location_dev@localhost:5434/location_test
      LOCATION_REDIS_URL_TEST: redis://localhost:6379/14
      REDIS_URL_TEST: redis://localhost:6379/15
      DISPATCH_REDIS_URL_TEST: redis://localhost:6379/13
    steps:
      # Las acciones van fijadas por commit (el tag, al lado): un tag se puede mover, un commit no.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crear las bases de test de identity y location
        env:
          PGPASSWORD: dispatch_dev
        run: |
          psql -h localhost -p 5434 -U dispatch_svc -d dispatch_test -c "CREATE ROLE identity_svc LOGIN PASSWORD 'identity_dev'"
          psql -h localhost -p 5434 -U dispatch_svc -d dispatch_test -c "CREATE DATABASE identity_test OWNER identity_svc"
          psql -h localhost -p 5434 -U dispatch_svc -d dispatch_test -c "CREATE ROLE location_svc LOGIN PASSWORD 'location_dev'"
          psql -h localhost -p 5434 -U dispatch_svc -d dispatch_test -c "CREATE DATABASE location_test OWNER location_svc"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  # Los cinco flujos de Playwright (PLAN 5.3) contra el sistema entero en Docker Compose, como en la demo.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # .env (de .env.example), clave RS256, Postgres y Redis en Compose, migraciones y usuarios del seed.
      - run: npm run setup
      # Los servicios y nginx, con la configuración del e2e, y la demo de flotas y zonas (e2e/levantar.mjs).
      - run: npm run e2e:levantar
      - run: npx -w @viajes/e2e playwright install --with-deps chromium
      - run: npm run e2e
      - name: Reporte de Playwright (HTML, trazas, capturas y videos de lo que falló)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright
          path: |
            e2e/reporte
            e2e/resultados
          retention-days: 14
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color --tail 200

  # SAST con Semgrep (PLAN 5.4): reglas de JavaScript, TypeScript, Node, OWASP y secretos. Cualquier
  # hallazgo hace fallar el job. Los falsos positivos se marcan en el código con `nosemgrep: <regla>` y
  # el motivo al lado (ver docs/ci.md).
  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep
        run: >-
          semgrep scan
          --config p/javascript --config p/typescript --config p/nodejsscan --config p/owasp-top-ten --config p/secrets
          --exclude 'docs/mediciones' --exclude '**/generated/**' --exclude '**/dist/**'
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_x_powered_by
          --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_check_csp
          --metrics off --error
          --sarif --output semgrep.sarif
      - name: Resultado en SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30
