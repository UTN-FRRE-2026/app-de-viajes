name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dispatch_svc
          POSTGRES_PASSWORD: dispatch_dev
          POSTGRES_DB: dispatch_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dispatch_svc -d dispatch_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://dispatch_svc:dispatch_dev@localhost:5434/dispatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
