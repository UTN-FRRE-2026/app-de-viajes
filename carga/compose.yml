# Entorno AISLADO para medir location con k6. Proyecto propio (`viajes-carga`): su Postgres, su
# Redis, su JWKS y sus credenciales. No comparte volumen, puertos ni red con el entorno de desarrollo
# (`app-viajes`). Las credenciales las genera `node carga/preparar.mjs` en carga/.secretos/.
#
#   docker compose -p viajes-carga -f carga/compose.yml --env-file carga/.secretos/carga.env up -d --wait
#
# Lo maneja carga/medir.ps1: no hace falta levantarlo a mano. dispatch solo se levanta con
# `medir.ps1 -Solicitudes` (la solicitud real de carga/solicitudes.js).
name: viajes-carga

x-etiquetas: &etiquetas
  app-viajes.entorno: carga

services:
  postgres:
    image: postgis/postgis:16-3.4
    labels: *etiquetas
    environment:
      POSTGRES_USER: carga
      POSTGRES_PASSWORD: "${CARGA_PG_PASSWORD:?falta CARGA_PG_PASSWORD, correr node carga/preparar.mjs}"
      POSTGRES_DB: location_carga
    # Sin volumen con nombre: los datos de carga son descartables.
    # Puerto fuera del rango dinámico de Windows (49152-65535), donde Hyper-V y WSL reservan bloques
    # al arrancar. Se cambia con CARGA_PG_PUERTO (medir.ps1 lee la misma variable).
    ports:
      - "127.0.0.1:${CARGA_PG_PUERTO:-45434}:5432"
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carga -d location_carga"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    labels: *etiquetas
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Sirve solo la clave PÚBLICA de carga. location de carga valida los tokens contra este JWKS,
  # nunca contra identity.
  jwks:
    image: node:22-alpine
    labels: *etiquetas
    command:
      - node
      - -e
      - "const fs=require('fs');require('http').createServer((q,r)=>{r.setHeader('content-type','application/json');r.end(fs.readFileSync('/jwks/jwks.json'))}).listen(8080)"
    volumes:
      - ./.secretos/jwks.json:/jwks/jwks.json:ro
    cpus: 0.25
    mem_limit: 64m

  location:
    build:
      context: ..
      args:
        SERVICE: location
    image: viajes-location:carga
    labels: *etiquetas
    environment:
      PUERTO: "3004"
      # info: location no loguea cada pedido; así quedan en el log el arranque y el apagado ordenado.
      NIVEL_LOG: info
      UBICACION_ESTRATEGIA: "${ESTRATEGIA:?falta ESTRATEGIA (ingenua u optimizada)}"
      LOCATION_DATABASE_URL: postgresql://carga:${CARGA_PG_PASSWORD}@postgres:5432/location_carga
      DB_POOL_MAX: "10"
      REDIS_URL: redis://redis:6379
      LOCATION_REDIS_PREFIJO: "carga:location:"
      JWKS_URL: http://jwks:8080/jwks.json
      JWT_ISSUER: viajes-carga
      JWT_AUDIENCE: viajes-carga
      LOCATION_TOKEN_SERVICIO: "${CARGA_TOKEN_SERVICIO:?falta CARGA_TOKEN_SERVICIO}"
      # Bearer de /metrics. En este entorno descartable se reusa el token de servicio de carga: medir.ps1
      # es el único que lo usa y no hace falta otro secreto.
      METRICAS_TOKEN: "${CARGA_TOKEN_SERVICIO:?falta CARGA_TOKEN_SERVICIO}"
    # Igual que el de Postgres: fuera del rango dinámico de Windows. Se cambia con CARGA_LOCATION_PUERTO.
    ports:
      - "127.0.0.1:${CARGA_LOCATION_PUERTO:-43004}:3004"
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwks:
        condition: service_started

  # dispatch de carga, para medir una solicitud real mientras k6 carga a location. Mismo Postgres (su
  # propia base, dispatch_carga), mismo Redis (prefijos dispatch:) y mismo JWKS. Busca candidatos en el
  # location de carga por la red interna. medir.ps1 crea y migra la base antes de levantarlo.
  dispatch:
    build:
      context: ..
      args:
        SERVICE: dispatch
    image: viajes-dispatch:carga
    labels: *etiquetas
    environment:
      PUERTO: "3005"
      NIVEL_LOG: info
      DISPATCH_PERSISTENCIA: postgres
      DATABASE_URL: postgresql://carga:${CARGA_PG_PASSWORD}@postgres:5432/dispatch_carga
      DB_POOL_MAX: "10"
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://jwks:8080/jwks.json
      JWT_ISSUER: viajes-carga
      JWT_AUDIENCE: viajes-carga
      DISPATCH_BUSCADOR: location
      LOCATION_URL: http://location:3004
      LOCATION_TOKEN_SERVICIO: "${CARGA_TOKEN_SERVICIO:?falta CARGA_TOKEN_SERVICIO}"
      METRICAS_TOKEN: "${CARGA_TOKEN_SERVICIO:?falta CARGA_TOKEN_SERVICIO}"
      # De relleno: dispatch lo exige por las flotas (verificar cuentas en identity), y la solicitud de
      # carga no da de alta choferes. No hay identity en este entorno.
      IDENTITY_URL: http://jwks:8080
      IDENTITY_TOKEN_SERVICIO: "${CARGA_TOKEN_SERVICIO:?falta CARGA_TOKEN_SERVICIO}"
      # Ofertas por solicitud y su vigencia. Sin variables, los valores de siempre (3 y 15 s).
      # carrera.ps1 pone 50 (el máximo de dispatch) y 120 s, para la carrera de 50 aceptaciones.
      OFERTAS_SIMULTANEAS: "${CARGA_OFERTAS_SIMULTANEAS:-3}"
      OFERTA_TTL_SEGUNDOS: "${CARGA_OFERTA_TTL_SEGUNDOS:-15}"
    # Igual que los otros: fuera del rango dinámico de Windows. Se cambia con CARGA_DISPATCH_PUERTO.
    ports:
      - "127.0.0.1:${CARGA_DISPATCH_PUERTO:-43005}:3005"
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwks:
        condition: service_started
